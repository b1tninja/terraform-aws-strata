name: Quality
# Runs on every PR: format, validate every configuration, the plan-time assertion suites,
# lint, security scan, docs check, OpenTofu compat.
#
# Two filters here used to be quietly wrong. The paths filters listed "**.tftpl", which is not
# this repository's extension - the boot script and the seeding script are *.tpl, and a change
# to only those files ran no CI at all, including the disk-identification fix that could format
# the wrong volume. And validate listed four modules by hand: 5 of the 17 configurations in the
# tree, missing every example and the module that renders the boot hooks. Both are derived from
# the working tree now, the same reason the Makefile is.

on:
  # Manual because the first push to a brand-new repository is not guaranteed to trigger anything,
  # and because after touching anything in Settings → Actions you want a way to prove the pipeline
  # is live without inventing a throwaway commit.
  workflow_dispatch:
  pull_request:
    paths:
      - "**/*.tf"
      - "**/*.tpl"
      - "**/*.tftpl"
      - "**/*.hcl"
      - "**/*.tfvars"
      - ".github/workflows/quality.yml"
      # The docs job regenerates README.md from the module using .terraform-docs.yml and the
      # terraform-docs version the devcontainer pins, so all three have to be able to start it.
      # They were not listed, which meant the check that exists to catch a stale generated section
      # could never run on a change to the files that make it stale.
      - ".terraform-docs.yml"
      - ".devcontainer/devcontainer.json"
      - "**/*.md"
      - "Makefile"
  push:
    # Both spellings on purpose: this repository's history is on master, while GitHub creates
    # new repositories on main. Whichever ends up the default branch after publishing, a push to
    # it has to run CI - a trigger that quietly matches nothing looks identical to a green repo.
    branches: [main, master]
    paths:
      # This list had drifted from the pull_request one above: it was missing the workflow file
      # itself, Makefile, **/*.tfvars and the docs inputs, so a push straight to the default branch
      # that changed CI ran no CI. Proven on this repository's second push: only quality.yml
      # changed, nothing matched, zero runs.
      - ".github/workflows/quality.yml"
      - "Makefile"
      - "**/*.tfvars"
      - "**/*.tf"
      - "**/*.tpl"
      - "**/*.tftpl"
      - "**/*.hcl"
      - ".terraform-docs.yml"
      - ".devcontainer/devcontainer.json"
      - "**/*.md"

permissions:
  contents: read

jobs:
  discover:
    name: Discover configurations
    runs-on: ubuntu-latest
    outputs:
      configs: ${{ steps.scan.outputs.configs }}
      tests: ${{ steps.scan.outputs.tests }}
    steps:
      - uses: actions/checkout@v4
      - id: scan
        run: |
          # Any directory holding a main.tf is a configuration Terraform could be pointed at,
          # which is the only rule that stays true as modules are added. tests/* is listed
          # separately because those are root modules whose value is the plan, not the apply,
          # and examples/layered-stacks holds no main.tf of its own.
          configs=$(find . -name main.tf -not -path './.terraform/*' -printf '%h\n' \
            | sed 's|^\./||' | sort -u | jq -R . | jq -s -c .)
          # %p, not %f: %f prints "boot_disk" and the job then runs `terraform -chdir=boot_disk`,
          # a directory that does not exist. The suites passed locally because the make target and
          # the verification loop both prefixed "tests/" themselves, so nothing here agreed with
          # anything else - the matrix was the only thing that got the path wrong, and only in CI.
          tests=$(find tests -mindepth 1 -maxdepth 1 -type d -printf '%p\n' \
            | sed 's|^\./||' | sort -u | jq -R . | jq -s -c .)
          echo "configs=$configs" >> "$GITHUB_OUTPUT"
          echo "tests=$tests" >> "$GITHUB_OUTPUT"
          echo "validating: $configs"
          echo "planning:   $tests"

  fmt:
    name: Format Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dflook/terraform-fmt-check@v1

  validate:
    name: Validate ${{ matrix.path }}
    needs: discover
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        path: ${{ fromJSON(needs.discover.outputs.configs) }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate ${{ matrix.path }}
        uses: dflook/terraform-validate@v1
        with:
          path: ${{ matrix.path }}

  contract-tests:
    name: Plan-time assertions (${{ matrix.dir }})
    needs: discover
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        dir: ${{ fromJSON(needs.discover.outputs.tests) }}
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      # These suites are the reason a wrong recipe length or an unsafe device guess can be
      # caught without an AWS account: every assertion runs during plan, against text rendered
      # from the real templates. They had no job before, which is how a failing one stayed
      # unnoticed in a directory nobody had initialised.
      - name: Plan ${{ matrix.dir }}
        run: |
          terraform -chdir=${{ matrix.dir }} init -backend=false -input=false
          terraform -chdir=${{ matrix.dir }} plan -no-color

  tflint:
    name: TFLint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: terraform-linters/setup-tflint@v4
        with:
          tflint_version: latest
      - name: Init plugins
        run: tflint --init
      - name: Run lint
        run: tflint --recursive --format=compact

  security:
    name: Trivy IaC Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: config
          scan-ref: .
          scanners: misconfig
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true

  tofu:
    name: OpenTofu Compatibility
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: latest
      - name: Tofu fmt check
        run: tofu fmt -recursive -check
      - name: Tofu validate
        run: |
          tofu init -backend=false
          tofu validate

  docs:
    name: Docs Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: terraform-docs/gh-actions@v1.4.1
        # Pinned to the patch tag deliberately. The action has no "version" input - its README
        # states "v1.4.1 (uses terraform-docs v0.20.0)", so the action tag IS the generator pin,
        # and "@v1" would float to whatever the newest v1.x bakes in. This job fails on a diff and
        # the committed tables were written by 0.20.0, so a floating generator turns the check red
        # the day upstream changes its markdown, for reasons unrelated to the pull request.
        # .devcontainer/devcontainer.json pins terraformDocsVersion to the same 0.20.0.
        with:
          working-dir: .
          config-file: .terraform-docs.yml
          output-file: README.md
          # Per the action's own input docs: leave these empty when the config file already
          # defines output.mode / output.file / output.template, so its defaults are not layered
          # on top of ours.
          output-method: ""
          template: ""
          fail-on-diff: true


