name: Quality
# Runs on every PR: format, validate every configuration, the plan-time assertion suites,
# lint, security scan, docs check, OpenTofu compat.
#
# Two filters here used to be quietly wrong. The paths filters listed "**.tftpl", which is not
# this repository's extension - the boot script and the seeding script are *.tpl, and a change
# to only those files ran no CI at all, including the disk-identification fix that could format
# the wrong volume. And validate listed four modules by hand: 5 of the 17 configurations in the
# tree, missing every example and the module that renders the boot hooks. Both are derived from
# the working tree now, the same reason the Makefile is.

on:
  pull_request:
    paths:
      - "**/*.tf"
      - "**/*.tpl"
      - "**/*.tftpl"
      - "**/*.hcl"
      - "**/*.tfvars"
      - ".github/workflows/quality.yml"
      - "Makefile"
  push:
    # Both spellings on purpose: this repository's history is on master, while GitHub creates
    # new repositories on main. Whichever ends up the default branch after publishing, a push to
    # it has to run CI - a trigger that quietly matches nothing looks identical to a green repo.
    branches: [main, master]
    paths:
      - "**/*.tf"
      - "**/*.tpl"
      - "**/*.tftpl"
      - "**/*.hcl"

permissions:
  contents: read

jobs:
  discover:
    name: Discover configurations
    runs-on: ubuntu-latest
    outputs:
      configs: ${{ steps.scan.outputs.configs }}
      tests: ${{ steps.scan.outputs.tests }}
    steps:
      - uses: actions/checkout@v4
      - id: scan
        run: |
          # Any directory holding a main.tf is a configuration Terraform could be pointed at,
          # which is the only rule that stays true as modules are added. tests/* is listed
          # separately because those are root modules whose value is the plan, not the apply,
          # and examples/layered-stacks holds no main.tf of its own.
          configs=$(find . -name main.tf -not -path './.terraform/*' -printf '%h\n' \
            | sed 's|^\./||' | sort -u | jq -R . | jq -s -c .)
          tests=$(find tests -mindepth 1 -maxdepth 1 -type d -printf '%f\n' \
            | sort -u | jq -R . | jq -s -c .)
          echo "configs=$configs" >> "$GITHUB_OUTPUT"
          echo "tests=$tests" >> "$GITHUB_OUTPUT"
          echo "validating: $configs"
          echo "planning:   $tests"

  fmt:
    name: Format Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dflook/terraform-fmt-check@v1

  validate:
    name: Validate ${{ matrix.path }}
    needs: discover
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        path: ${{ fromJSON(needs.discover.outputs.configs) }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate ${{ matrix.path }}
        uses: dflook/terraform-validate@v1
        with:
          path: ${{ matrix.path }}

  contract-tests:
    name: Plan-time assertions (${{ matrix.dir }})
    needs: discover
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        dir: ${{ fromJSON(needs.discover.outputs.tests) }}
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      # These suites are the reason a wrong recipe length or an unsafe device guess can be
      # caught without an AWS account: every assertion runs during plan, against text rendered
      # from the real templates. They had no job before, which is how a failing one stayed
      # unnoticed in a directory nobody had initialised.
      - name: Plan ${{ matrix.dir }}
        run: |
          terraform -chdir=${{ matrix.dir }} init -backend=false -input=false
          terraform -chdir=${{ matrix.dir }} plan -no-color

  tflint:
    name: TFLint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: terraform-linters/setup-tflint@v4
        with:
          tflint_version: latest
      - name: Init plugins
        run: tflint --init
      - name: Run lint
        run: tflint --recursive --format=compact

  security:
    name: Trivy IaC Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: aquasecurity/trivy-action@master
        with:
          scan-type: config
          scan-ref: .
          scanners: misconfig
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true

  tofu:
    name: OpenTofu Compatibility
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: latest
      - name: Tofu fmt check
        run: tofu fmt -recursive -check
      - name: Tofu validate
        run: |
          tofu init -backend=false
          tofu validate

  docs:
    name: Docs Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: terraform-docs/gh-actions@v1
        # fail-on-diff is enforced again: the generated tables are now committed, and
        # `terraform-docs . --config .terraform-docs.yml --output-mode verify` exits 0 against
        # them. With the old invalid config the tool never parsed this file, so the section was
        # always empty and enforcing it would have failed every run for the wrong reason.
        with:
          working-dir: .
          config-file: .terraform-docs.yml
          output-file: README.md
          fail-on-diff: true


