# Suppressions for `trivy config`, referenced by trivy.yaml (report.ignorefile). Every entry needs
# a statement: an ID with no reason attached is how a security gate quietly stops meaning anything.

misconfigurations:
  # AVD-AWS-0104 (CRITICAL): "A security group rule should not allow unrestricted egress to any
  # IP address." This is accepted deliberately, and it is accepted for the whole repository rather
  # than file by file because it is a property of the design, not of one security group.
  #
  # These instances have to reach ghcr.io for the engine image and whatever CDN a model download
  # resolves to - HuggingFace redirects to rotating object-storage addresses that cannot be
  # expressed as a stable CIDR, and a prefix list covers AWS services only. Narrowing egress here
  # means a boot that fails partway through a multi-hundred-gigabyte download, on an instance that
  # is billing while it retries.
  #
  # What limits the blast radius instead: the instances are ephemeral and rebuilt rather than
  # patched; ingress is one API port governed by var.allowed_cidr_blocks; the API key is not baked
  # into user_data but fetched from Secrets Manager over an IMDSv2-required instance
  # (metadata_options.http_tokens = "required"), which is the path an egress-restricted box would
  # still have to open.
  - id: AVD-AWS-0104
    statement: >-
      Egress is intentionally unrestricted: the engine image comes from ghcr.io and model weights
      from rotating CDN addresses that cannot be pinned to a CIDR. Compensating controls:
      ephemeral instances, one ingress port gated by allowed_cidr_blocks, API key fetched from
      Secrets Manager over IMDSv2 rather than baked into user_data.

  # AVD-AWS-0131 (HIGH): "Instance with unencrypted block device." Six of these, all pointing at
  # aws_instance.strata (main.tf:314) and aws_instance.strata_spot (main.tf:330) reached through the
  # examples that call the module. Both resources declare no block device of their own - they are
  # launch-template based, `launch_template { id = aws_launch_template.strata.id }` - and the
  # template defines every mapping explicitly encrypted: the /dev/sda1 root at main.tf:222-229 and
  # each dynamic data-volume branch at 237-245, 256-264 and 273-280. Trivy's Terraform parser does
  # not follow block devices across a launch-template reference, so the instance looks bare and the
  # rule reports the device it cannot see rather than the one that will exist.
  #
  # Scoped to main.tf rather than global, because that is the only place this pattern occurs; the
  # module instances that declare root_block_device inline are still checked. What would slip
  # through - an unencrypted inline block device added to these two instances later, or an ebs
  # mapping that loses its encrypted setting - is guarded by tests/block_devices, which reads
  # main.tf and fails on either. That suite is the expiry date on this suppression: change the
  # block-device layout and the test sends you back to re-justify the ignore.
  - id: AVD-AWS-0131
    paths:
      - "main.tf"
    statement: >-
      False positive from launch-template inheritance: aws_instance.strata and strata_spot declare
      no block devices and take every mapping from aws_launch_template.strata, which sets
      encrypted = true on the root and on all three data-volume branches (main.tf:222-280).
      Trivy does not resolve block devices across a launch_template reference.
