# Validated with terraform-docs v0.20.0 - the version terraform-docs/gh-actions@v1.4.1 bundles and
# the version CI therefore runs, and the version .devcontainer/devcontainer.json installs. Keep all
# three on the same number: the generated markdown is compared byte for byte in CI, and the table
# rules differ across versions (0.20.0 emits "|------|", 0.24.0 emits "| ---- |").
#
# The shape matters: "formatter" is a plain string naming the formatter, and its options live in
# the top-level "settings" map, where "lockfile" is a boolean (use the lock file to resolve
# provider versions), not a path.
#
# The file this replaces nested type/settings under "formatter" and listed "hide" as a sequence.
# terraform-docs refused it outright:
#   'formatter' expected type 'string', got unconvertible type 'map[string]interface {}'
# so every invocation that passed --config .terraform-docs.yml failed before reading the module,
# which means the CI docs job and "make docs" never generated anything at all - and nothing
# noticed, because the job only compared a section that had never been written.
formatter: markdown

settings:
  indent: 2
  lockfile: true

sort:
  enabled: true
  by: name

content: |
  {{ .Inputs }}

  {{ .Outputs }}

  {{ .Modules }}

  {{ .Resources }}

output:
  file: README.md
  mode: inject
  template: |-
    <!-- BEGIN_TF_DOCS -->
    {{ .Content }}
    <!-- END_TF_DOCS -->

